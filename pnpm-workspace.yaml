# Not an actual monorepo — this field only exists because Vercel's deploy
# pins to pnpm 9.x for this project, and pnpm 9 hard-errors on a
# pnpm-workspace.yaml with no `packages` field. Do not remove.
packages:
  - '.'

allowBuilds:
  esbuild: true
  react-vertical-timeline-component: true
  sharp: true

# Security: force patched versions of transitive deps whose parents haven't
# bumped them yet (Dependabot alerts). Remove once upstreams catch up.
overrides:
  path-to-regexp@>=4.0.0 <6.3.0: ^6.3.0
  esbuild@<=0.24.2: ^0.25.0
  i18next-http-backend@<4.0.2: ^4.0.2
